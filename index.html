<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>چت‌بات</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-deep: #0d0e26;
    --violet: #7c5cff;
    --cyan: #22d3ee;
    --pink: #ff5fa2;
    --surface: rgba(255,255,255,0.06);
    --surface-strong: rgba(255,255,255,0.1);
    --border: rgba(255,255,255,0.12);
    --text: #f2f0fb;
    --text-dim: #a29fc4;
    --app-height: 100vh;
  }

  * { box-sizing: border-box; }

  html, body {
    height: var(--app-height);
    margin: 0;
    font-family: 'Vazirmatn', Tahoma, sans-serif;
    color: var(--text);
    overflow: hidden;
    overscroll-behavior: none;
  }

  .aurora {
    position: fixed;
    inset: 0;
    z-index: -1;
    background: var(--bg-deep);
    overflow: hidden;
  }
  .aurora span {
    position: absolute;
    border-radius: 50%;
    filter: blur(90px);
    opacity: 0.55;
    will-change: transform;
  }
  .aurora span:nth-child(1) {
    width: 480px; height: 480px;
    background: var(--violet);
    top: -10%; right: -10%;
    animation: float1 22s ease-in-out infinite alternate;
  }
  .aurora span:nth-child(2) {
    width: 420px; height: 420px;
    background: var(--cyan);
    bottom: -15%; left: -10%;
    animation: float2 26s ease-in-out infinite alternate;
  }
  .aurora span:nth-child(3) {
    width: 380px; height: 380px;
    background: var(--pink);
    top: 40%; left: 35%;
    animation: float3 30s ease-in-out infinite alternate;
  }
  @keyframes float1 {
    from { transform: translate(0,0) scale(1); }
    to   { transform: translate(-60px, 80px) scale(1.15); }
  }
  @keyframes float2 {
    from { transform: translate(0,0) scale(1); }
    to   { transform: translate(70px, -50px) scale(1.1); }
  }
  @keyframes float3 {
    from { transform: translate(0,0) scale(1); }
    to   { transform: translate(-40px, -60px) scale(0.9); }
  }
  @media (prefers-reduced-motion: reduce) {
    .aurora span { animation: none; }
  }

  .app {
    display: flex;
    height: var(--app-height);
    padding: calc(18px + env(safe-area-inset-top)) 18px calc(18px + env(safe-area-inset-bottom));
    gap: 16px;
  }

  .sidebar {
    width: 260px;
    flex-shrink: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    backdrop-filter: blur(20px);
    border-radius: 26px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    transition: transform 0.3s ease;
  }

  .new-chat-btn {
    background: linear-gradient(135deg, var(--violet), var(--pink));
    color: white;
    border: none;
    border-radius: 999px;
    padding: 13px 20px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .new-chat-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 8px 24px rgba(124,92,255,0.4);
  }

  .chat-list {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .chat-item {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 11px 16px;
    border-radius: 999px;
    cursor: pointer;
    font-size: 13.5px;
    color: var(--text-dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    border: 1px solid transparent;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .chat-item:hover {
    background: var(--surface-strong);
    color: var(--text);
  }
  .chat-item.active {
    background: var(--surface-strong);
    border-color: var(--border);
    color: var(--text);
  }
  .chat-item .title { overflow: hidden; text-overflow: ellipsis; }
  .chat-item .del-btn {
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 15px;
    cursor: pointer;
    opacity: 0;
    padding: 0 0 0 6px;
    transition: opacity 0.15s ease;
  }
  .chat-item:hover .del-btn { opacity: 1; }
  .chat-item .del-btn:hover { color: var(--pink); }

  .chat-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  .topbar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 4px 8px 14px 8px;
  }
  .topbar h2 { margin: 0; font-size: 17px; font-weight: 600; }
  .menu-toggle {
    display: none;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 999px;
    width: 40px; height: 40px;
    font-size: 16px;
    cursor: pointer;
    flex-shrink: 0;
  }

  #chat-box {
    flex: 1;
    overflow-y: auto;
    background: var(--surface);
    border: 1px solid var(--border);
    backdrop-filter: blur(20px);
    border-radius: 28px;
    padding: 22px;
    margin-bottom: 14px;
    display: flex;
    flex-direction: column;
  }

  .message-wrapper {
    display: flex;
    flex-direction: column;
    margin-bottom: 16px;
    max-width: 78%;
  }
  .message-wrapper.user { align-self: flex-end; align-items: flex-end; }
  .message-wrapper.bot { align-self: flex-start; align-items: flex-start; }

  .message {
    padding: 11px 18px;
    border-radius: 999px;
    white-space: pre-wrap;
    word-wrap: break-word;
    line-height: 1.6;
    font-size: 14.5px;
  }
  .user .message {
    background: linear-gradient(135deg, var(--violet), var(--cyan));
    color: white;
    border-bottom-left-radius: 6px;
  }
  .bot .message {
    background: var(--surface-strong);
    border: 1px solid var(--border);
    color: var(--text);
    border-bottom-right-radius: 6px;
  }

  .copy-btn {
    margin-top: 5px;
    background: none;
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-size: 11px;
    padding: 3px 12px;
    border-radius: 999px;
    cursor: pointer;
    font-family: inherit;
    transition: color 0.15s ease, border-color 0.15s ease;
  }
  .copy-btn:hover { color: var(--text); border-color: var(--text-dim); }
  .copy-btn.copied { color: var(--cyan); border-color: var(--cyan); }

  .input-group {
    display: flex;
    gap: 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    backdrop-filter: blur(20px);
    border-radius: 999px;
    padding: 6px 6px 6px 20px;
  }
  input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: inherit;
    font-size: 14.5px;
    padding: 10px 0;
  }
  input::placeholder { color: var(--text-dim); }

  button.send-btn {
    background: linear-gradient(135deg, var(--violet), var(--pink));
    color: white;
    border: none;
    border-radius: 999px;
    padding: 12px 26px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    flex-shrink: 0;
  }
  button.send-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 8px 20px rgba(124,92,255,0.4);
  }

  @media (max-width: 760px) {
    .app { padding: calc(10px + env(safe-area-inset-top)) 10px calc(10px + env(safe-area-inset-bottom)); }
    .menu-toggle { display: block; }
    .sidebar {
      position: fixed;
      top: calc(10px + env(safe-area-inset-top));
      right: 10px;
      bottom: calc(10px + env(safe-area-inset-bottom));
      width: 240px;
      height: auto;
      z-index: 30;
      transform: translateX(110%);
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    html[dir="rtl"] .sidebar { transform: translateX(-110%); right: auto; left: 10px; }
    html[dir="rtl"] .sidebar.open { transform: translateX(0); }
    .sidebar.open { transform: translateX(0); }
    .sidebar-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: 25;
    }
    .sidebar-backdrop.open { display: block; }
    .message-wrapper { max-width: 90%; }
  }
</style>
</head>
<body>

<div class="aurora"><span></span><span></span><span></span></div>
<div class="sidebar-backdrop" id="sidebar-backdrop" onclick="toggleSidebar()"></div>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <button class="new-chat-btn" onclick="createNewChat()">
      ✦ چت جدید
    </button>
    <div class="chat-list" id="chat-list"></div>
  </aside>

  <main class="chat-area">
    <div class="topbar">
      <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
      <h2 id="chat-title">چت‌بات</h2>
    </div>

    <div id="chat-box"></div>

    <div class="input-group">
      <input type="text" id="user-input" placeholder="پیام خود را بنویسید..." onkeydown="if(event.key==='Enter') sendMessage()">
      <button class="send-btn" onclick="sendMessage()">ارسال</button>
    </div>
  </main>
</div>

<script>
(function initTelegram() {
  if (!window.Telegram || !window.Telegram.WebApp) return;
  const tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();
  if (typeof tg.disableVerticalSwipes === 'function') tg.disableVerticalSwipes();

  function applyHeight() {
    const h = tg.viewportStableHeight || tg.viewportHeight || window.innerHeight;
    document.documentElement.style.setProperty('--app-height', h + 'px');
  }
  applyHeight();
  tg.onEvent('viewportChanged', applyHeight);
  window.addEventListener('resize', applyHeight);
})();

// تشخیص اینکه واقعاً داخل تلگرام هستیم یا داخل یه مرورگر معمولی (کروم و ...)
const IS_TELEGRAM = !!(window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData);

const STORAGE_KEY = 'chatbot_multichat_v1';
const chatBox = document.getElementById('chat-box');
const chatListEl = document.getElementById('chat-list');
const chatTitleEl = document.getElementById('chat-title');
const sidebarEl = document.getElementById('sidebar');
const backdropEl = document.getElementById('sidebar-backdrop');
let state = null;

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

function loadState() {
  const saved = localStorage.getItem(STORAGE_KEY);
  if (saved) {
    state = JSON.parse(saved);
    return;
  }
  const id = uid();
  state = {
    activeId: id,
    chats: {
      [id]: {
        title: 'گفتگوی جدید',
        messages: [{ role: 'bot', text: 'سلام! چطور می‌تونم کمکت کنم؟' }]
      }
    }
  };
  saveState();
}

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function getActiveChat() {
  return state.chats[state.activeId];
}

function createNewChat() {
  const id = uid();
  state.chats[id] = {
    title: 'گفتگوی جدید',
    messages: [{ role: 'bot', text: 'سلام! چطور می‌تونم کمکت کنم؟' }]
  };
  state.activeId = id;
  saveState();
  renderAll();
  closeSidebarOnMobile();
}

function switchChat(id) {
  state.activeId = id;
  saveState();
  renderAll();
  closeSidebarOnMobile();
}

function showConfirmDialog(message, callback) {
  if (IS_TELEGRAM && window.Telegram.WebApp.showConfirm) {
    window.Telegram.WebApp.showConfirm(message, callback);
  } else {
    callback(window.confirm(message));
  }
}

function deleteChat(id, event) {
  event.stopPropagation();
  showConfirmDialog('این گفتگو پاک بشه؟', (confirmed) => {
    if (!confirmed) return;
    delete state.chats[id];

    if (Object.keys(state.chats).length === 0) {
      const newId = uid();
      state.chats[newId] = {
        title: 'گفتگوی جدید',
        messages: [{ role: 'bot', text: 'سلام! چطور می‌تونم کمکت کنم؟' }]
      };
      state.activeId = newId;
    } else if (state.activeId === id) {
      state.activeId = Object.keys(state.chats)[0];
    }
    saveState();
    renderAll();
  });
}

function renderSidebar() {
  chatListEl.innerHTML = '';
  Object.entries(state.chats).forEach(([id, chat]) => {
    const item = document.createElement('div');
    item.className = 'chat-item' + (id === state.activeId ? ' active' : '');
    item.onclick = () => switchChat(id);

    const title = document.createElement('span');
    title.className = 'title';
    title.textContent = chat.title;

    const del = document.createElement('button');
    del.className = 'del-btn';
    del.textContent = '×';
    del.onclick = (e) => deleteChat(id, e);

    item.appendChild(title);
    item.appendChild(del);
    chatListEl.appendChild(item);
  });
}

function renderMessages() {
  chatBox.innerHTML = '';
  const chat = getActiveChat();
  chat.messages.forEach(msg => renderBubble(msg.role, msg.text));
  scrollToBottom();
  chatTitleEl.textContent = chat.title;
}

function renderBubble(role, text) {
  const wrapper = document.createElement('div');
  wrapper.className = `message-wrapper ${role}`;

  const bubble = document.createElement('div');
  bubble.className = 'message';
  bubble.textContent = text;

  const copyBtn = document.createElement('button');
  copyBtn.className = 'copy-btn';
  copyBtn.textContent = '📋 کپی';
  copyBtn.onclick = () => copyText(text, copyBtn);

  wrapper.appendChild(bubble);
  wrapper.appendChild(copyBtn);
  chatBox.appendChild(wrapper);
}

function renderAll() {
  renderSidebar();
  renderMessages();
}

function copyText(text, btn) {
  navigator.clipboard.writeText(text).then(() => {
    const original = btn.textContent;
    btn.textContent = '✅ کپی شد';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = original;
      btn.classList.remove('copied');
    }, 1500);
  }).catch(() => {
    if (IS_TELEGRAM && window.Telegram.WebApp.showAlert) {
      window.Telegram.WebApp.showAlert('کپی نشد، مرورگرت اجازه نداد.');
    } else {
      alert('کپی نشد، مرورگرت اجازه نداد.');
    }
  });
}

function scrollToBottom() {
  chatBox.scrollTop = chatBox.scrollHeight;
}

function toggleSidebar() {
  sidebarEl.classList.toggle('open');
  backdropEl.classList.toggle('open');
}
function closeSidebarOnMobile() {
  sidebarEl.classList.remove('open');
  backdropEl.classList.remove('open');
}

function sendMessage() {
  const inputField = document.getElementById('user-input');
  const messageText = inputField.value.trim();
  if (!messageText) return;

  const chat = getActiveChat();

  const isFirstUserMsg = !chat.messages.some(m => m.role === 'user');
  if (isFirstUserMsg) {
    chat.title = messageText.length > 28 ? messageText.slice(0, 28) + '…' : messageText;
  }

  chat.messages.push({ role: 'user', text: messageText });
  saveState();
  renderAll();
  inputField.value = '';

  fetch('/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ message: messageText })
  })
  .then(response => response.json())
  .then(data => {
    chat.messages.push({ role: 'bot', text: data.response });
    saveState();
    renderMessages();
    renderSidebar();
  })
  .catch(error => {
    chat.messages.push({ role: 'bot', text: 'خطا در ارتباط با سرور.' });
    saveState();
    renderMessages();
    console.error('Error:', error);
  });
}

loadState();
renderAll();
</script>
</body>
</html>
